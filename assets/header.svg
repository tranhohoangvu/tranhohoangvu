<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 80" fill="none">
  <defs>
    <linearGradient id="name-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6; #06B6D4; #8B5CF6; #EC4899; #3B82F6" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4; #8B5CF6; #EC4899; #3B82F6; #06B6D4" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6; #EC4899; #3B82F6; #06B6D4; #8B5CF6" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <style>
      .greeting-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 34px;
        font-weight: 700;
        fill: #1f2937;
      }
      .name-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 34px;
        font-weight: 800;
        fill: url(#name-gradient);
      }
      @media (prefers-color-scheme: dark) {
        .greeting-text {
          fill: #f3f4f6;
        }
      }
    </style>
  </defs>

  <g transform="translate(425, 50)">
    <!-- Waving hand -->
    <g transform="translate(-250, 0)">
      <g>
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="0 0 0; 16 0 0; -10 0 0; 16 0 0; -6 0 0; 12 0 0; 0 0 0; 0 0 0"
          keyTimes="0; 0.12; 0.24; 0.36; 0.48; 0.60; 0.72; 1"
          dur="2.5s"
          repeatCount="indefinite"
        />
        <text font-size="34" x="0" y="0" text-anchor="middle" dominant-baseline="auto">👋</text>
      </g>
    </g>

    <!-- Greeting & Name -->
    <text x="-215" y="-2" dominant-baseline="auto">
      <tspan class="greeting-text">Hi, I'm </tspan>
      <tspan class="name-text">Tran Ho Hoang Vu</tspan>
    </text>
  </g>
</svg>
