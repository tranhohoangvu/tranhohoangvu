<svg
  width="100%"
  height="220"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  style="z-index:1;position:relative"
  viewBox="0 0 854 220"
>
  <style>
    .text {
      font-size: 40px;
      font-weight: 700;
      font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji;
      fill: #ffffff;
    }
    .desc {
      font-size: 20px;
      font-weight: 500;
      font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji;
      fill: #ffffff;
    }
    .wave-hand {
      transform-origin: 0px 16px;
      animation: wave 2.5s infinite;
    }
    @keyframes wave {
      0% { transform: rotate(0deg); }
      12% { transform: rotate(18deg); }
      24% { transform: rotate(-10deg); }
      36% { transform: rotate(18deg); }
      48% { transform: rotate(-6deg); }
      60% { transform: rotate(12deg); }
      72% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    .text, .desc, .wave-container {
      animation: fadeIn 1.2s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <defs>
    <linearGradient id="linear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Animated Wave Background -->
  <g transform="translate(427, 110) scale(1, 1) translate(-427, -110)">
    <path d="" fill="url(#linear)" opacity="0.4">
      <animate
        attributeName="d"
        dur="20s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcmod="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="0s"
        values="M0 0L 0 140Q 213.5 180 427 150T 854 175L 854 0 Z;M0 0L 0 165Q 213.5 180 427 160T 854 150L 854 0 Z;M0 0L 0 185Q 213.5 155 427 185T 854 150L 854 0 Z;M0 0L 0 140Q 213.5 180 427 150T 854 175L 854 0 Z">
      </animate>
    </path>
    <path d="" fill="url(#linear)" opacity="0.4">
      <animate
        attributeName="d"
        dur="20s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcmod="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="-10s"
        values="M0 0L 0 155Q 213.5 200 427 170T 854 180L 854 0 Z;M0 0L 0 170Q 213.5 140 427 140T 854 160L 854 0 Z;M0 0L 0 165Q 213.5 145 427 170T 854 185L 854 0 Z;M0 0L 0 155Q 213.5 200 427 170T 854 180L 854 0 Z">
      </animate>
    </path>
  </g>

  <!-- Waving Hand -->
  <g class="wave-container" transform="translate(160, 84)">
    <g class="wave-hand">
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 0 16; 18 0 16; -10 0 16; 18 0 16; -6 0 16; 12 0 16; 0 0 16; 0 0 16"
        keyTimes="0; 0.12; 0.24; 0.36; 0.48; 0.60; 0.72; 1"
        dur="2.5s"
        repeatCount="indefinite"
      />
      <text text-anchor="middle" dominant-baseline="middle" font-size="40" style="font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji;">👋</text>
    </g>
  </g>

  <!-- Greeting Text -->
  <text text-anchor="start" dominant-baseline="middle" x="195" y="84" class="text" stroke="#none" stroke-width="1">Hi, I'm Tran Ho Hoang Vu</text>

  <!-- Subtitle -->
  <text text-anchor="middle" dominant-baseline="middle" x="50%" y="128" class="desc" stroke="#none" stroke-width="1">Backend Developer • AI Engineer</text>
</svg>
